<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Gastos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --ink: #111B26;
  --muted: #5B6A79;
  --line: #CFD7E0;
  --accent: #2440E0;
  --accent-ink: #FFFFFF;
  --gold: #F2B632;
  --danger: #B42323;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D131A;
    --surface: #161F29;
    --ink: #E9EEF3;
    --muted: #94A2B1;
    --line: #2A3542;
    --accent: #7088FF;
    --accent-ink: #0B1020;
    --gold: #F2B632;
    --danger: #FF8A8A;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0 auto;
  max-width: 560px;
  padding: env(safe-area-inset-top) 18px calc(150px + env(safe-area-inset-bottom));
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.35 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Encabezado */
.top { display: flex; align-items: center; gap: 8px; padding: 12px 0 2px; min-height: 56px; }
.spacer { flex: 1; }
.fecha-wrap { position: relative; }
.fecha {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface);
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.fecha.manual { border-color: var(--gold); }
.fecha svg { width: 16px; height: 16px; color: var(--muted); }
#fechaInp { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.texto-btn {
  min-height: 44px; padding: 0 10px; border: 0; background: none;
  font-size: 15px; font-weight: 600; color: var(--accent);
}
.badge {
  min-height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid var(--gold); background: transparent;
  font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.icono-btn {
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; background: none; color: var(--muted); border-radius: 12px;
}
.icono-btn svg { width: 24px; height: 24px; }
.total-mes { margin: 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Monto */
.monto-fila {
  display: flex; align-items: baseline; gap: 6px;
  margin-top: 22px; padding-bottom: 6px; border-bottom: 2px solid var(--line);
}
.monto-fila:focus-within { border-bottom-color: var(--accent); }
.signo { font: 700 40px ui-rounded, -apple-system, system-ui, sans-serif; color: var(--muted); }
#monto {
  flex: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: transparent;
  color: var(--ink); caret-color: var(--accent);
  font: 800 64px/1.1 ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
#monto::placeholder { color: var(--line); }

/* Campos */
.campo {
  width: 100%; min-height: 52px; margin-top: 18px; padding: 0 14px;
  border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 17px;
}
.campo::placeholder { color: var(--muted); }
h2 { margin: 26px 0 10px; font-size: 15px; font-weight: 650; color: var(--muted); }
h3 { margin: 18px 0 10px; font-size: 15px; font-weight: 650; color: var(--muted); }

/* Botones de elección */
.segmento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opcion {
  min-height: 52px; border-radius: 16px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 650;
}
.opcion[aria-pressed="true"], .chip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  min-height: 48px; padding: 0 16px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 600;
}
.chips.sub .chip { min-height: 44px; border-radius: 999px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Barra inferior */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  max-width: 560px; margin: 0 auto;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 78%, transparent);
}
.guardar {
  width: 100%; min-height: 60px; border: 0; border-radius: 18px;
  background: var(--accent); color: var(--accent-ink);
  font-size: 19px; font-weight: 700;
}
.guardar.incompleto { background: var(--line); color: var(--muted); }
.guardar:disabled { opacity: .6; }
#toast {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 10px; padding: 12px 16px; border-radius: 14px;
  background: var(--ink); color: var(--bg); font-weight: 600;
  animation: sube .18s ease-out;
}
#toast button {
  min-height: 36px; padding: 0 4px; border: 0; background: none;
  color: inherit; font-weight: 700; text-decoration: underline;
}
@keyframes sube { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #toast { animation: none; } }

/* Configuración */
.overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  padding: 18px; background: rgba(8, 12, 18, .6);
}
.panel {
  width: min(100%, 520px); max-height: 100%; overflow: auto;
  padding: 22px; border-radius: 22px; background: var(--bg);
}
.panel h1 { margin: 0 0 6px; font-size: 22px; }
.panel p { margin: 0 0 4px; color: var(--muted); font-size: 15px; }
.panel label { display: block; margin-top: 16px; font-size: 15px; font-weight: 650; color: var(--muted); }
.panel .campo { margin-top: 6px; font-size: 16px; }
.error { min-height: 20px; margin: 12px 0 0; font-size: 15px; font-weight: 600; color: var(--danger); }
.acciones { display: flex; gap: 10px; margin-top: 8px; }
.acciones .guardar { min-height: 54px; font-size: 17px; }
.acciones .secundario {
  min-height: 54px; padding: 0 18px; border-radius: 18px;
  border: 1.5px solid var(--line); background: transparent; font-weight: 650;
}
</style>
</head>
<body>

<header class="top">
  <div class="fecha-wrap">
    <button class="fecha" id="fechaBtn" type="button" tabindex="-1" aria-hidden="true">
      <span id="fechaTxt"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <input id="fechaInp" type="datetime-local" aria-label="Fecha y hora del gasto. Toca para cambiarla">
  </div>
  <button class="texto-btn" id="ahoraBtn" type="button" hidden>Usar ahora</button>
  <span class="spacer"></span>
  <button class="badge" id="syncBadge" type="button" hidden></button>
  <button class="icono-btn" id="cfgBtn" type="button" aria-label="Conexión con Google Sheets">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
</header>
<p class="total-mes" id="totalMes" hidden></p>

<main>
  <div class="monto-fila">
    <span class="signo" aria-hidden="true">$</span>
    <label class="sr" for="monto">Monto en pesos</label>
    <input id="monto" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
  </div>

  <label class="sr" for="concepto">Concepto</label>
  <input class="campo" id="concepto" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="Concepto (por ejemplo, tacos con Ana)">

  <h2>Método de pago</h2>
  <div class="segmento" id="metodos"></div>
  <div class="chips" id="tarjetas"></div>

  <h2>Categoría</h2>
  <div class="grid2" id="cats"></div>
  <h3 id="subTitulo" hidden></h3>
  <div class="chips sub" id="subs"></div>
</main>

<div class="barra" id="barra">
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <button class="guardar incompleto" id="guardar" type="button">Guardar gasto</button>
</div>

<div class="overlay" id="config" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cfgTitulo">
    <h1 id="cfgTitulo">Conecta tu hoja</h1>
    <p>Pega la URL de tu puente de Apps Script y la clave secreta. Solo se guardan en este teléfono.</p>
    <label for="cfgUrl">URL del puente</label>
    <input class="campo" id="cfgUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="cfgClave">Clave secreta</label>
    <input class="campo" id="cfgClave" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pega la clave">
    <p class="error" id="cfgError" role="alert"></p>
    <div class="acciones">
      <button class="secundario" id="cfgCancelar" type="button">Cancelar</button>
      <button class="guardar" id="cfgGuardar" type="button">Guardar y probar</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ---------- Configuración de categorías y tarjetas ---------- */
const CATEGORIAS = {
  'Comida': ['Supermercado', 'Restaurantes', 'Cafés', 'Delivery', 'Snacks'],
  'Transporte': ['Coche (crédito)', 'Gasolina', 'Mantenimiento', 'Seguro y trámites', 'Uber/taxi', 'Estacionamiento', 'Casetas', 'Transporte público'],
  'Salud': ['Consultas', 'Medicamentos', 'Seguro', 'Gimnasio'],
  'Entretenimiento': ['Salidas', 'Cine/eventos', 'Viajes', 'Apuestas'],
  'Suscripciones': ['Streaming', 'Apps', 'Software', 'Celular'],
  'Compras': ['Ropa', 'Tecnología', 'Hogar', 'Regalos'],
  'Educación': ['Cursos', 'Libros'],
  'Otros': []
};
const TARJETAS = {
  'Crédito': ['Banamex Plat', 'Banamex Oro', 'Amex Aero', 'Amex Plat', 'Nu Crédito'],
  'Débito': ['Priority', 'Nu Débito']
};
const METODOS = ['Crédito', 'Débito', 'Efectivo'];
const SUB_SIN_SUBCATEGORIA = 'General';

/* ---------- Utilidades ---------- */
const $ = function (id) { return document.getElementById(id); };
const store = {
  get: function (k, d) {
    try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
  },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const pesos = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
const pad = function (n) { return String(n).padStart(2, '0'); };
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function claveMes(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function valorInputFecha(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function etiquetaFecha(d) {
  const hoy = new Date();
  const ini = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
  const dias = Math.round((ini(hoy) - ini(d)) / 86400000);
  const hora = d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (dias === 0) return 'Hoy, ' + hora;
  if (dias === 1) return 'Ayer, ' + hora;
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }).replace('.', '') + ', ' + hora;
}

/* ---------- Estado ---------- */
const S = { monto: '', concepto: '', metodo: null, tarjeta: null, cat: null, sub: null, fechaManual: null };
let ultima = store.get('ultima', { metodo: null, tarjetas: {} });
let cola = store.get('cola', []);
let opEnEnvio = null;
let enviando = false;

function cfg() {
  const c = store.get('cfg', null);
  return c && c.url && c.clave ? c : null;
}
function guardarCola() { store.set('cola', cola); }

/* ---------- Fecha ---------- */
function fechaActual() { return S.fechaManual || new Date(); }
function pintarFecha() {
  const d = fechaActual();
  $('fechaTxt').textContent = etiquetaFecha(d);
  $('fechaBtn').classList.toggle('manual', !!S.fechaManual);
  $('ahoraBtn').hidden = !S.fechaManual;
  if (!S.fechaManual) $('fechaInp').value = valorInputFecha(d);
}
$('fechaInp').addEventListener('change', function () {
  const v = $('fechaInp').value;
  const d = v ? new Date(v) : null;
  S.fechaManual = d && !isNaN(d) ? d : null;
  pintarFecha();
});
$('ahoraBtn').addEventListener('click', function () { S.fechaManual = null; pintarFecha(); });

/* ---------- Monto ---------- */
function parseMonto() {
  const n = parseFloat(S.monto.replace(/,/g, ''));
  return isFinite(n) ? n : 0;
}
$('monto').addEventListener('input', function (e) {
  let v = e.target.value.replace(/[^0-9.]/g, '');
  const i = v.indexOf('.');
  if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '').slice(0, 2);
  let ent = i === -1 ? v : v.slice(0, i);
  const dec = i === -1 ? '' : v.slice(i);
  ent = ent.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  S.monto = ent + dec;
  e.target.value = S.monto;
  pintarGuardar();
});
$('concepto').addEventListener('input', function (e) { S.concepto = e.target.value; });
$('concepto').addEventListener('keydown', function (e) { if (e.key === 'Enter') e.target.blur(); });

/* ---------- Botones de elección ---------- */
function crearBoton(texto, activo, clase, alTocar) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = clase;
  b.textContent = texto;
  b.setAttribute('aria-pressed', activo ? 'true' : 'false');
  b.addEventListener('click', alTocar);
  return b;
}
function pintarMetodos() {
  const cont = $('metodos'); cont.innerHTML = '';
  METODOS.forEach(function (m) {
    cont.appendChild(crearBoton(m, S.metodo === m, 'opcion', function () {
      S.metodo = m;
      S.tarjeta = TARJETAS[m] && ultima.tarjetas[m] && TARJETAS[m].indexOf(ultima.tarjetas[m]) !== -1 ? ultima.tarjetas[m] : null;
      ultima.metodo = m; store.set('ultima', ultima);
      pintarMetodos(); pintarTarjetas(); pintarGuardar();
    }));
  });
}
function pintarTarjetas() {
  const cont = $('tarjetas'); cont.innerHTML = '';
  (TARJETAS[S.metodo] || []).forEach(function (t) {
    cont.appendChild(crearBoton(t, S.tarjeta === t, 'chip', function () {
      S.tarjeta = t;
      ultima.tarjetas[S.metodo] = t; store.set('ultima', ultima);
      pintarTarjetas(); pintarGuardar();
    }));
  });
}
function pintarCategorias() {
  const cont = $('cats'); cont.innerHTML = '';
  Object.keys(CATEGORIAS).forEach(function (c) {
    cont.appendChild(crearBoton(c, S.cat === c, 'opcion', function () {
      S.cat = c; S.sub = null;
      pintarCategorias(); pintarSubs(); pintarGuardar();
      if (CATEGORIAS[c].length) $('subs').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }));
  });
}
function pintarSubs() {
  const cont = $('subs'); cont.innerHTML = '';
  const lista = S.cat ? CATEGORIAS[S.cat] : [];
  $('subTitulo').hidden = !lista.length;
  if (lista.length) $('subTitulo').textContent = 'Subcategoría de ' + S.cat;
  lista.forEach(function (s) {
    cont.appendChild(crearBoton(s, S.sub === s, 'chip', function () {
      S.sub = s; pintarSubs(); pintarGuardar();
    }));
  });
}

/* ---------- Validación y guardado ---------- */
function faltante() {
  if (!(parseMonto() > 0)) return 'Escribe el monto';
  if (!S.metodo) return 'Elige el método de pago';
  if (S.metodo !== 'Efectivo' && !S.tarjeta) return 'Elige la tarjeta';
  if (!S.cat) return 'Elige la categoría';
  if (CATEGORIAS[S.cat].length && !S.sub) return 'Elige la subcategoría';
  return null;
}
function pintarGuardar() { $('guardar').classList.toggle('incompleto', !!faltante()); }

$('guardar').addEventListener('click', function () {
  const f = faltante();
  if (f) { toast(f, null, 2500); return; }
  if (!cfg()) { abrirConfig(true); return; }
  const rec = {
    id: uuid(),
    fecha: fechaActual().toISOString(),
    metodo: S.metodo,
    tarjeta: S.metodo === 'Efectivo' ? '' : S.tarjeta,
    concepto: S.concepto.trim(),
    monto: parseMonto(),
    categoria: S.cat,
    subcategoria: S.sub || SUB_SIN_SUBCATEGORIA
  };
  cola.push(Object.assign({ accion: 'agregar' }, rec));
  guardarCola();
  S.monto = ''; S.concepto = ''; S.cat = null; S.sub = null; S.fechaManual = null;
  $('monto').value = ''; $('concepto').value = '';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  window.scrollTo({ top: 0 });
  pintarCategorias(); pintarSubs(); pintarFecha(); pintarGuardar(); pintarSync(); pintarTotal();
  toast('Guardado ✓', function () { deshacer(rec); }, 6000);
  vaciarCola();
});

function deshacer(rec) {
  const i = cola.findIndex(function (o) { return o.accion === 'agregar' && o.id === rec.id; });
  if (i !== -1 && cola[i] !== opEnEnvio) {
    cola.splice(i, 1);           // aún no salía: basta con quitarlo de la cola
  } else {
    cola.push({ accion: 'borrar', id: rec.id, monto: rec.monto, fecha: rec.fecha });
  }
  guardarCola();
  // Devuelve los datos al formulario para poder corregirlos
  S.monto = rec.monto.toLocaleString('en-US', { maximumFractionDigits: 2 });
  S.concepto = rec.concepto; S.metodo = rec.metodo; S.tarjeta = rec.tarjeta || null;
  S.cat = rec.categoria; S.sub = rec.subcategoria === SUB_SIN_SUBCATEGORIA ? null : rec.subcategoria;
  S.fechaManual = new Date(rec.fecha);
  $('monto').value = S.monto; $('concepto').value = S.concepto;
  pintarMetodos(); pintarTarjetas(); pintarCategorias(); pintarSubs(); pintarFecha(); pintarGuardar();
  pintarSync(); pintarTotal();
  toast('Gasto deshecho. Corrígelo y vuelve a guardar', null, 3500);
  vaciarCola();
}

/* ---------- Aviso ---------- */
let toastTimer = null;
function toast(msg, alDeshacer, ms) {
  const t = $('toast');
  t.innerHTML = '';
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if (alDeshacer) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = 'Deshacer';
    b.addEventListener('click', function () { ocultarToast(); alDeshacer(); });
    t.appendChild(b);
  }
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(ocultarToast, ms || 3000);
}
function ocultarToast() { $('toast').hidden = true; }

/* ---------- Envío a Google Sheets ---------- */
async function enviar(op, conf) {
  const c = conf || cfg();
  const ctrl = new AbortController();
  const t = setTimeout(function () { ctrl.abort(); }, 20000);
  try {
    // Cuerpo como texto plano: evita la verificación previa (CORS) que Apps Script no admite
    const res = await fetch(c.url, {
      method: 'POST',
      body: JSON.stringify(Object.assign({}, op, { clave: c.clave })),
      signal: ctrl.signal
    });
    try { return await res.json(); } catch (e) { return { ok: false, error: 'respuesta inválida' }; }
  } finally { clearTimeout(t); }
}

async function vaciarCola() {
  if (enviando || !cfg()) return;
  enviando = true;
  let errorMostrado = false;
  try {
    while (cola.length) {
      const op = cola[0];
      opEnEnvio = op;
      let r;
      try { r = await enviar(op); } catch (e) { break; }   // sin conexión: se queda en la cola
      if (r && r.ok) {
        const i = cola.indexOf(op);
        if (i !== -1) cola.splice(i, 1);
        guardarCola();
        ajustarTotalCache(op);
        pintarSync(); pintarTotal();
      } else {
        if (!errorMostrado) {
          errorMostrado = true;
          if (r && r.error === 'no autorizado') { toast('La clave no coincide. Revísala en ajustes', null, 4000); abrirConfig(true); }
          else toast('No se pudo enviar (' + ((r && r.error) || 'error') + '). Se reintentará', null, 4000);
        }
        break;
      }
    }
  } finally { opEnEnvio = null; enviando = false; }
  pintarSync();
  actualizarTotal();
}

function pintarSync() {
  const n = cola.length;
  const b = $('syncBadge');
  b.hidden = n === 0;
  if (n) b.textContent = (navigator.onLine ? '' : 'Sin conexión · ') + n + (n === 1 ? ' pendiente' : ' pendientes');
}
$('syncBadge').addEventListener('click', function () { vaciarCola(); });

/* ---------- Total del mes ---------- */
function ajustarTotalCache(op) {
  const c = store.get('total', null);
  if (!c || !op.fecha || claveMes(new Date(op.fecha)) !== c.mes) return;
  if (op.accion === 'agregar') c.total += op.monto;
  if (op.accion === 'borrar') c.total -= op.monto;
  store.set('total', c);
}
function pintarTotal() {
  const el = $('totalMes');
  if (!cfg()) { el.hidden = true; return; }
  const mes = claveMes(new Date());
  const c = store.get('total', null);
  let pendiente = 0;
  cola.forEach(function (o) {
    if (o.fecha && claveMes(new Date(o.fecha)) === mes) {
      if (o.accion === 'agregar') pendiente += o.monto;
      if (o.accion === 'borrar') pendiente -= o.monto;
    }
  });
  const nombre = new Date().toLocaleDateString('es-MX', { month: 'long' });
  const titulo = nombre.charAt(0).toUpperCase() + nombre.slice(1);
  const base = c && c.mes === mes ? c.total : null;
  el.textContent = titulo + ': ' + (base === null && !pendiente ? '…' : pesos.format((base || 0) + pendiente));
  el.hidden = false;
}
async function actualizarTotal() {
  if (!cfg() || cola.length) return;
  try {
    const mes = claveMes(new Date());
    const r = await enviar({ accion: 'total', mes: mes });
    if (r && r.ok) { store.set('total', { mes: mes, total: r.total }); pintarTotal(); }
  } catch (e) {}
}

/* ---------- Conexión (primer uso y ajustes) ---------- */
let configObligatoria = false;
function abrirConfig(obligatoria) {
  configObligatoria = !!(obligatoria && !cfg());
  const c = cfg();
  $('cfgUrl').value = c ? c.url : '';
  $('cfgClave').value = c ? c.clave : '';
  $('cfgError').textContent = '';
  $('cfgTitulo').textContent = c ? 'Conexión con tu hoja' : 'Conecta tu hoja';
  $('cfgCancelar').hidden = configObligatoria;
  $('config').hidden = false;
  setTimeout(function () { (c ? $('cfgUrl') : $('cfgUrl')).focus(); }, 50);
}
function cerrarConfig() { $('config').hidden = true; }
$('cfgBtn').addEventListener('click', function () { abrirConfig(false); });
$('cfgCancelar').addEventListener('click', cerrarConfig);
$('cfgGuardar').addEventListener('click', async function () {
  const url = $('cfgUrl').value.trim();
  const clave = $('cfgClave').value.trim();
  const err = function (m) { $('cfgError').textContent = m; };
  if (url.indexOf('https://script.google.com/') !== 0 || !/\/exec$/.test(url)) {
    err('La URL debe empezar con https://script.google.com/ y terminar en /exec'); return;
  }
  if (!clave) { err('Pega la clave secreta'); return; }
  const btn = $('cfgGuardar');
  btn.disabled = true; btn.textContent = 'Probando…'; err('');
  try {
    const mes = claveMes(new Date());
    const r = await enviar({ accion: 'total', mes: mes }, { url: url, clave: clave });
    if (r && r.ok) {
      store.set('cfg', { url: url, clave: clave });
      store.set('total', { mes: mes, total: r.total });
      cerrarConfig(); pintarTotal();
      toast('Conectado ✓', null, 2500);
      vaciarCola();
    } else if (r && r.error === 'no autorizado') {
      err('La clave no coincide. Cópiala de nuevo desde el registro de ejecución.');
    } else {
      err('El puente respondió con un error: ' + ((r && r.error) || 'desconocido') + '. Revisa que la implementación sea "Cualquier persona".');
    }
  } catch (e) {
    err('No se pudo conectar. Revisa la URL y tu conexión.');
  } finally { btn.disabled = false; btn.textContent = 'Guardar y probar'; }
});

/* ---------- Teclado y arranque ---------- */
// Al tocar fuera de un campo se cierra el teclado (el teclado decimal de iOS no tiene tecla de cerrar)
document.addEventListener('touchstart', function (e) {
  const a = document.activeElement;
  if (a && (a.id === 'monto' || a.id === 'concepto') && e.target !== a && e.target.tagName !== 'INPUT') a.blur();
}, { passive: true });

// Mantiene el botón Guardar visible por encima del teclado
if (window.visualViewport) {
  const ajustar = function () {
    const vv = window.visualViewport;
    const desfase = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    $('barra').style.transform = desfase ? 'translateY(' + (-desfase) + 'px)' : '';
  };
  window.visualViewport.addEventListener('resize', ajustar);
  window.visualViewport.addEventListener('scroll', ajustar);
}

window.addEventListener('online', function () { pintarSync(); vaciarCola(); });
window.addEventListener('offline', pintarSync);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { pintarFecha(); pintarSync(); pintarTotal(); vaciarCola(); }
});
setInterval(function () { if (!S.fechaManual) pintarFecha(); }, 30000);

if (ultima.metodo && METODOS.indexOf(ultima.metodo) !== -1) {
  S.metodo = ultima.metodo;
  const t = ultima.tarjetas[S.metodo];
  if (TARJETAS[S.metodo] && TARJETAS[S.metodo].indexOf(t) !== -1) S.tarjeta = t;
}
pintarMetodos(); pintarTarjetas(); pintarCategorias(); pintarSubs();
pintarFecha(); pintarGuardar(); pintarSync(); pintarTotal();

if (!cfg()) abrirConfig(true);
else { $('monto').focus(); vaciarCola(); }

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
